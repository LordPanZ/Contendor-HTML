<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Documento · HTML Container</title>
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HTML Container">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="viewer-page">

<header class="vbar">
  <a class="btn btn--ghost btn--icon" href="index.html" title="Ir al contenedor" aria-label="Ir al contenedor">🗄️</a>
  <span class="vbar__title" id="v-title">Cargando…</span>
  <span class="vbar__badge hidden" id="v-badge">compartido</span>
  <button class="btn btn--sm hidden" id="v-save">＋ <span class="label">Guardar en mi contenedor</span></button>
  <button class="btn btn--sm" id="v-download">⬇️ <span class="label">Descargar</span></button>
</header>

<div class="vstage hidden" id="v-stage"></div>

<div class="vmsg hidden" id="v-msg">
  <div class="vmsg__card">
    <div class="vmsg__icon" id="v-msg-icon">🔒</div>
    <h1 class="vmsg__title" id="v-msg-title">Contenedor bloqueado</h1>
    <p class="vmsg__text" id="v-msg-text"></p>
    <a class="btn btn--primary" href="index.html" id="v-msg-action">Abrir el contenedor</a>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="assets/js/util.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/viewer.js"></script>
</body>
</html>
